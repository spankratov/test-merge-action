name: Sync Branches After Release

# This workflow is for repositories with STRICT branch protection that requires:
# - "Require status checks to pass"
# - "Require branches to be up to date before merging"
#
# It creates an intermediate branch, merges main into it, waits for checks,
# then creates a PR to main. This ensures the branch is up-to-date and checks pass.
#
# For repositories WITHOUT the "Require branches to be up to date" setting,
# use sync-after-release-simple.yml instead.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: true
        type: string

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Wait for Status Checks on Release Candidate Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          RC_BRANCH="releases/v$VERSION"

          echo "Waiting for status checks on $RC_BRANCH..."

          # Get the latest commit SHA on the RC branch
          COMMIT_SHA=$(git rev-parse "origin/$RC_BRANCH")
          echo "Checking commit: $COMMIT_SHA"

          # Wait for all checks to complete
          MAX_ATTEMPTS=60
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            echo "Attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS"

            # Get all check runs for the commit
            CHECK_RUNS=$(gh api "repos/${{ github.repository }}/commits/$COMMIT_SHA/check-runs" --jq '.check_runs')

            TOTAL_CHECKS=$(echo "$CHECK_RUNS" | jq 'length')
            echo "Total checks: $TOTAL_CHECKS"

            if [ "$TOTAL_CHECKS" -eq 0 ]; then
              echo "No checks found yet, waiting..."
              sleep 10
              ATTEMPT=$((ATTEMPT + 1))
              continue
            fi

            # Check if all check runs are completed
            INCOMPLETE=$(echo "$CHECK_RUNS" | jq '[.[] | select(.status != "completed")] | length')

            if [ "$INCOMPLETE" -gt 0 ]; then
              echo "Checks still running: $INCOMPLETE incomplete"
              sleep 10
              ATTEMPT=$((ATTEMPT + 1))
              continue
            fi

            # All checks completed, now check if all succeeded
            FAILED=$(echo "$CHECK_RUNS" | jq '[.[] | select(.conclusion != "success" and .conclusion != "skipped")] | length')

            if [ "$FAILED" -gt 0 ]; then
              echo "Check runs failed!"
              echo "$CHECK_RUNS" | jq '.[] | select(.conclusion != "success" and .conclusion != "skipped") | {name: .name, conclusion: .conclusion}'
              exit 1
            fi

            echo "All check runs passed!"
            break
          done

          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo "Timeout waiting for check runs"
            exit 1
          fi

      - name: Merge Release Candidate to Release Branch
        id: merge-release
        run: |
          # Extract version from the payload sent by Concourse
          VERSION="${{ inputs.version }}"
          RC_BRANCH="releases/v$VERSION"

          echo "Detected version: $VERSION"
          echo "Syncing $RC_BRANCH -> release"

          git checkout release
          
          git merge "origin/$RC_BRANCH" --no-edit
          
          git push origin release

      - name: Create Intermediate Branch and Merge Main
        run: |
          VERSION="${{ inputs.version }}"
          INTERMEDIATE_BRANCH="sync-release-to-main-v$VERSION"

          echo "Creating intermediate branch: $INTERMEDIATE_BRANCH"

          # Create intermediate branch from release
          git checkout -b "$INTERMEDIATE_BRANCH" origin/release

          # Merge main into the intermediate branch to bring it up-to-date
          echo "Merging main into $INTERMEDIATE_BRANCH..."
          git merge origin/main --no-edit -m "chore: Merge main into intermediate branch for sync"

          # Push intermediate branch
          git push origin "$INTERMEDIATE_BRANCH"

          echo "Intermediate branch created and pushed"

      - name: Wait for Status Checks on Intermediate Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          INTERMEDIATE_BRANCH="sync-release-to-main-v$VERSION"

          echo "Waiting for status checks on $INTERMEDIATE_BRANCH..."

          # Get the latest commit SHA on the intermediate branch
          COMMIT_SHA=$(git rev-parse "origin/$INTERMEDIATE_BRANCH")
          echo "Checking commit: $COMMIT_SHA"

          # Wait for checks to appear and complete
          # If no checks appear after initial wait, assume no checks are configured for this branch
          MAX_ATTEMPTS=60
          ATTEMPT=0
          NO_CHECKS_THRESHOLD=6  # After 6 attempts (60 seconds), assume no checks are configured

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            echo "Attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS"

            # Get all check runs for the commit
            CHECK_RUNS=$(gh api "repos/${{ github.repository }}/commits/$COMMIT_SHA/check-runs" --jq '.check_runs')

            TOTAL_CHECKS=$(echo "$CHECK_RUNS" | jq 'length')
            echo "Total checks: $TOTAL_CHECKS"

            if [ "$TOTAL_CHECKS" -eq 0 ]; then
              if [ $ATTEMPT -ge $NO_CHECKS_THRESHOLD ]; then
                echo "No checks configured for this branch after $NO_CHECKS_THRESHOLD attempts."
                echo "Proceeding since checks already passed on release candidate branch."
                break
              fi
              echo "No checks found yet, waiting..."
              sleep 10
              ATTEMPT=$((ATTEMPT + 1))
              continue
            fi

            # Check if all check runs are completed
            INCOMPLETE=$(echo "$CHECK_RUNS" | jq '[.[] | select(.status != "completed")] | length')

            if [ "$INCOMPLETE" -gt 0 ]; then
              echo "Checks still running: $INCOMPLETE incomplete"
              sleep 10
              ATTEMPT=$((ATTEMPT + 1))
              continue
            fi

            # All checks completed, now check if all succeeded
            FAILED=$(echo "$CHECK_RUNS" | jq '[.[] | select(.conclusion != "success" and .conclusion != "skipped")] | length')

            if [ "$FAILED" -gt 0 ]; then
              echo "Check runs failed!"
              echo "$CHECK_RUNS" | jq '.[] | select(.conclusion != "success" and .conclusion != "skipped") | {name: .name, conclusion: .conclusion}'
              exit 1
            fi

            echo "All check runs passed!"
            break
          done

          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo "Timeout waiting for check runs"
            exit 1
          fi

      - name: Create and Merge PR to Main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          INTERMEDIATE_BRANCH="sync-release-to-main-v$VERSION"

          pr_url=$(gh pr create \
            --base main \
            --head "$INTERMEDIATE_BRANCH" \
            --title "chore: Sync release to main (v$VERSION)" \
            --body "Automated PR to sync changes from release branch to main after production deployment.")

          echo "PR Created: $pr_url"

          # Since the intermediate branch is up-to-date with main and checks have passed,
          # the PR should be ready to merge immediately.
          # We try direct merge first, and fall back to auto-merge if checks are still pending.
          if ! gh pr merge "$pr_url" --merge; then
            echo "Direct merge failed, enabling auto-merge..."
            gh pr merge "$pr_url" --merge --auto
          fi

          echo "PR merged successfully!"

      - name: Cleanup Intermediate Branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          INTERMEDIATE_BRANCH="sync-release-to-main-v$VERSION"

          echo "Cleaning up intermediate branch: $INTERMEDIATE_BRANCH"
          git push origin --delete "$INTERMEDIATE_BRANCH" || echo "Branch already deleted or doesn't exist"
